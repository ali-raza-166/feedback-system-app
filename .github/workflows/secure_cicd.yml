name: DevSecOps - Scan & Push to ACR

# Stage 1: 4 security checks run in parallel on every push/PR
# Stage 2: Build image and push to ACR (main only, after all security checks pass)
# Stage 3: Deploy to Azure App Service (main only, after image is pushed)
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    security-events: write
    actions: read

env:
    IMAGE_NAME: feedback-system
    ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
    # ====================== STAGE 1: SECURITY (every branch/PR) =============

    secret-scan:
        name: Secret scan (Gitleaks)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    sast:
        name: SAST (Semgrep)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install Semgrep
              run: pip install semgrep
            - name: Run Semgrep
              run: >
                  semgrep scan
                  --config=p/default
                  --config=p/typescript
                  --config=p/javascript
                  --config=p/react
                  --config=p/security-audit
                  --sarif --output=semgrep.sarif
              continue-on-error: true

    dependency-scan:
        name: SCA (Trivy)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Trivy scan (SARIF report)
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: fs
                  scan-ref: .
                  scanners: vuln
                  format: sarif
                  output: trivy.sarif

            - name: Trivy gate (fail on CRITICAL)
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: fs
                  scan-ref: .
                  scanners: vuln
                  severity: CRITICAL
                  ignore-unfixed: false
                  exit-code: "1"
                  format: table

    sbom:
        name: SBOM (Syft / CycloneDX)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Generate source SBOM
              uses: anchore/sbom-action@v0
              with:
                  path: .
                  format: cyclonedx-json
                  output-file: sbom.cdx.json
                  artifact-name: sbom.cdx.json

    # ====================== STAGE 2: BUILD & PUSH (main only) ===============

    build-push:
        name: Build & push image to ACR
        runs-on: ubuntu-latest
        needs: [secret-scan, sast, dependency-scan, sbom]
        if: github.ref == 'refs/heads/main'
        outputs:
            latest_tag: ${{ steps.vars.outputs.latest_tag }}
        steps:
            - uses: actions/checkout@v4

            - name: Compute image tag
              id: vars
              run: echo "latest_tag=${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

            - name: Build image
              run: |
                  docker build \
                  --build-arg NEXT_PUBLIC_DOMAIN="${{ secrets.NEXT_PUBLIC_DOMAIN }}" \
                  -t "${{ steps.vars.outputs.latest_tag }}" .

            - name: Log in to ACR
              run: echo "${{ secrets.ACR_PASSWORD }}" | docker login "${ACR_LOGIN_SERVER}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

            - name: Push image to ACR
              run: docker push "${{ steps.vars.outputs.latest_tag }}"

    # ====================== STAGE 3: DEPLOY (main only) =====================

    deploy:
        name: Deploy to Azure App Service
        runs-on: ubuntu-latest
        needs: build-push
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Deploy container image to App Service
              uses: azure/webapps-deploy@v3
              with:
                  app-name: feedbackappdemo
                  publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
                  images: ${{ needs.build-push.outputs.latest_tag }}
