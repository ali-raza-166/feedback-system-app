    # ====================== STAGE 3: DEPLOY (main only) =====================

    deploy:
        name: Deploy to Azure App Service
        runs-on: ubuntu-latest
        needs: container-scan
        # [UPDATE]: Changed from 'needs: build-push' to 'needs: container-scan' so deployment ONLY happens if the Trivy security scan passes.
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Deploy container image to App Service
              uses: azure/webapps-deploy@v3
              with:
                  app-name: feedbackappdemo
                  publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
                  images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
                  # [UPDATE]: Replaced masked needs output with explicit env string formatting.
