name: DevSecOps - Scan & Push to ACR

# Stage 1: 4 security checks run in parallel on every push/PR
# Stage 2: Build image and push to ACR (main only, after all security checks pass)
# Stage 3: Deploy to Azure App Service (main only, after image is pushed)
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    security-events: write
    actions: read

env:
    IMAGE_NAME: feedback-system
    ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
    # ====================== STAGE 1: SECURITY (every branch/PR) =============

    secret-scan:
        name: Secret scan (Gitleaks)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    secret-verify:
        name: Secret verify (TruffleHog)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run TruffleHog (pull request)
              if: github.event_name == 'pull_request'
              uses: trufflesecurity/trufflehog@main
              with:
                  path: ./
                  base: ${{ github.event.pull_request.base.sha }}
                  head: ${{ github.event.pull_request.head.sha }}
                  extra_args: --results=verified

            - name: Run TruffleHog (push to main)
              if: >
                  (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
                  && github.event.before != '0000000000000000000000000000000000000000'
              uses: trufflesecurity/trufflehog@main
              with:
                  path: ./
                  base: ${{ github.event.before }}
                  head: ${{ github.event.after }}
                  extra_args: --results=verified

            - name: Run TruffleHog (first push — full scan, no diff)
              if: >
                  (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
                  && github.event.before == '0000000000000000000000000000000000000000'
              uses: trufflesecurity/trufflehog@main
              with:
                  path: ./
                  extra_args: --results=verified
    sast:
        name: SAST (Semgrep)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install Semgrep
              run: pip install semgrep
            - name: Run Semgrep
              run: >
                  semgrep scan
                  --config=p/default
                  --config=p/typescript
                  --config=p/javascript
                  --config=p/react
                  --config=p/security-audit
                  --sarif --output=semgrep.sarif

    dependency-scan:
        name: SCA (Trivy)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Trivy scan (SARIF report)
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: fs
                  scan-ref: .
                  scanners: vuln
                  format: sarif
                  output: trivy.sarif

            - name: Trivy gate (fail on CRITICAL)
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: fs
                  scan-ref: .
                  scanners: vuln
                  severity: CRITICAL
                  ignore-unfixed: false
                  exit-code: "1"
                  format: table

    sbom:
        name: SBOM (Syft / CycloneDX)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Generate source SBOM
              uses: anchore/sbom-action@v0
              with:
                  path: .
                  format: cyclonedx-json
                  output-file: sbom.cdx.json
                  artifact-name: sbom.cdx.json

    # ====================== STAGE 2: BUILD & PUSH (main only) ===============

    build-push:
        name: Build & push image to ACR
        runs-on: ubuntu-latest
        needs: [secret-scan, secret-verify, sast, dependency-scan, sbom]
        if: github.ref == 'refs/heads/main'
        # [UPDATE]: Removed 'outputs:' block here. Passing a tag containing a GitHub secret (ACR_LOGIN_SERVER) caused GitHub to mask it into an empty string ("").
        steps:
            - uses: actions/checkout@v4

            - name: Build image
              run: |
                  docker build \
                  --build-arg NEXT_PUBLIC_DOMAIN="${{ secrets.NEXT_PUBLIC_DOMAIN }}" \
                  --build-arg MONGODB_URI="${{ secrets.MONGODB_URI }}" \
                  -t "${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest" .
                  # [UPDATE]: Replaced dynamic step outputs with direct env variables to avoid secret masking.

            - name: Log in to ACR
              run: echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ env.ACR_LOGIN_SERVER }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin
              # [UPDATE]: Replaced direct ACR_LOGIN_SERVER reference with ${{ env.ACR_LOGIN_SERVER }} for consistency.

            - name: Push image to ACR
              run: docker push "${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest"
              # [UPDATE]: Switched push command to use the reconstructed env variable string.

